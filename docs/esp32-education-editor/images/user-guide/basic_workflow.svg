<svg xmlns="http://www.w3.org/2000/svg" width="985" height="240" viewBox="0 0 985 240" role="img" aria-label="基本的な利用手順">
<title>基本的な利用手順</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52616b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="75" width="165" height="90" rx="14" fill="#9966FF" stroke="#41505a" stroke-width="1.5"/>
<text x="102.5" y="106" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1. Firmware</text>
<text x="102.5" y="131" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">Installerで</text>
<text x="102.5" y="149" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">v0.1.8を書き込む</text>
<rect x="215" y="75" width="165" height="90" rx="14" fill="#4C97FF" stroke="#41505a" stroke-width="1.5"/>
<text x="297.5" y="106" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2. Editor</text>
<text x="297.5" y="131" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">公開Editorを開く</text>
<rect x="410" y="75" width="165" height="90" rx="14" fill="#0FBD8C" stroke="#41505a" stroke-width="1.5"/>
<text x="492.5" y="106" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#ffffff">3. 接続</text>
<text x="492.5" y="131" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">ESP32 接続を追加し</text>
<text x="492.5" y="149" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">Web Serial接続</text>
<rect x="605" y="75" width="165" height="90" rx="14" fill="#FFAB19" stroke="#41505a" stroke-width="1.5"/>
<text x="687.5" y="106" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#ffffff">4. プログラム</text>
<text x="687.5" y="131" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">必要な拡張と</text>
<text x="687.5" y="149" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">ブロックを組む</text>
<rect x="800" y="75" width="165" height="90" rx="14" fill="#FF6680" stroke="#41505a" stroke-width="1.5"/>
<text x="882.5" y="106" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#ffffff">5. 確認・保存</text>
<text x="882.5" y="131" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">実機動作を確認し</text>
<text x="882.5" y="149" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#ffffff">PCへ保存</text>
<line x1="185" y1="120" x2="215" y2="120" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="380" y1="120" x2="410" y2="120" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="575" y1="120" x2="605" y2="120" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="120" x2="800" y2="120" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>