<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-label="ESP32 Education Editorの画面構成">
<title>ESP32 Education Editorの画面構成</title>
<rect width="980" height="480" fill="#f5f7fa"/>
<rect x="10" y="10" width="960" height="52" rx="8" fill="#4C97FF"/>
<text x="30" y="42" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#fff">上部メニュー：言語／ファイル／ファームウェア書き込み／About</text>
<rect x="10" y="72" width="210" height="398" rx="8" fill="#eaf0f6" stroke="#91a4b3"/>
<text x="115" y="105" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#34444e">カテゴリー／ブロック</text>
<rect x="235" y="72" width="455" height="398" rx="8" fill="#ffffff" stroke="#91a4b3"/>
<text x="462" y="105" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#34444e">スクリプト作成エリア</text>
<rect x="705" y="72" width="265" height="245" rx="8" fill="#ffffff" stroke="#91a4b3"/>
<text x="837" y="105" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#34444e">ステージ</text>
<rect x="705" y="332" width="265" height="138" rx="8" fill="#ffffff" stroke="#91a4b3"/>
<text x="837" y="365" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#34444e">スプライト／背景</text>
<text x="115" y="145" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#52616b">ESP32拡張を追加すると</text>
<text x="115" y="168" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#52616b">カテゴリーが表示されます</text>
<text x="462" y="145" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#52616b">ブロックをドラッグして</text>
<text x="462" y="168" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#52616b">プログラムを組み立てます</text>
</svg>