<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <rect x="2" y="4" width="36" height="32" rx="6" fill="#FF6680"/>

  <!-- Servo body -->
  <rect x="11" y="18" width="18" height="13" rx="2"
        fill="none" stroke="white" stroke-width="2"/>

  <!-- Mounting tabs -->
  <rect x="8" y="21" width="4" height="7" rx="1" fill="white"/>
  <rect x="28" y="21" width="4" height="7" rx="1" fill="white"/>

  <!-- Output shaft -->
  <circle cx="20" cy="16" r="3"
          fill="#FF6680" stroke="white" stroke-width="2"/>

  <!-- Servo horn -->
  <line x1="20" y1="13" x2="20" y2="8"
        stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="26" y2="10"
        stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>