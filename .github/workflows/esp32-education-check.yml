name: ESP32 Education checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: BME280 checked transfers and recovery
        run: bash firmware/test/run.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESP32 extension JavaScript syntax
        shell: bash
        run: |
          for f in packages/scratch-vm/src/extensions/esp32education_shared/*.js packages/scratch-vm/src/extensions/scratch3_esp32edu*/index.js; do
            node --check "$f"
          done

      - name: Build monorepo
        run: npm run build

      - name: ESP32 protocol, saved-project and language regressions
        run: npm exec --workspace packages/scratch-vm -- tap --disable-coverage test/integration/esp32-*.js

      - name: ESP32 GUI language regressions
        run: npm exec --workspace packages/scratch-gui -- jest --runInBand --runTestsByPath test/unit/reducers/esp32-locales.test.jsx test/unit/components/esp32-menu-i18n.test.jsx test/unit/util/esp32-about.test.js
